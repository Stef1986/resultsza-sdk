name: Publish MCP server to npm

# Publishes the resultsza-mcp package (mcp/) via npm Trusted Publishing (OIDC).
# Runs only for releases tagged mcp-vX.Y.Z; SDK releases (vX.Y.Z) are ignored here,
# and the SDK publish workflows ignore mcp-v* releases.
#
# One-time setup on npmjs.com (after the first manual publish of resultsza-mcp):
#   npmjs.com > package "resultsza-mcp" > Settings > Trusted Publisher > GitHub Actions
#     Organization or user:  Stef1986
#     Repository:            resultsza-sdk
#     Workflow filename:     publish-mcp.yml
#     (leave Environment blank)
#
# The MCP Registry entry (za.co.resultsza/mcp) is published by hand with mcp-publisher
# after each npm release; its signing key never lives in this repository.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for Trusted Publishing (OIDC)

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'mcp-v') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest # OIDC trusted publishing needs npm >= 11.5.1
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build
      - run: npm publish --provenance --access public
